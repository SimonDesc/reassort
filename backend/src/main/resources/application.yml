spring:
  application:
    name: reassort
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reassort}
    username: ${DB_USER:reassort}
    password: ${DB_PASSWORD:reassort}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  # Le front est servi par Spring Boot : le navigateur revalide chaque fichier (304 s'il n'a pas changé), si bien
  # qu'un redéploiement est visible tout de suite, sans index.html périmé qui pointerait vers d'anciens fichiers.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  # Serveur MCP (Spring AI) : HTTP streamable sur /mcp
  ai:
    mcp:
      server:
        name: reassort
        version: 1.0.0
        protocol: streamable
        instructions: >
          Réassort est l'assistant de commande et de déstockage d'une pharmacie d'officine.
          Réponds en français, avec des montants en euros HT et des dates lisibles.
          Pour « que dois-je commander ? », appelle ruptures_a_venir puis proposer_panier, et présente le panier
          par fournisseur en signalant les ruptures imminentes, les livraisons après rupture et le franco de port.
          Ne valide jamais un panier et ne publie jamais une annonce sans l'accord explicite du pharmacien.

management:
  endpoints:
    web:
      exposure:
        include: health

reassort:
  mcp:
    jeton: ${REASSORT_MCP_JETON:}
