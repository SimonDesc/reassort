# Déploiement (Coolify) ou essai local avec Docker : l'application et sa base.
# Sur Coolify, les variables SERVICE_* sont générées par Coolify lui-même : mot de passe de la base, jeton MCP
# et adresse publique (sous-domaine sslip.io par défaut). Pour développer, préférer `./mvnw spring-boot:test-run`.
services:
  app:
    build: .
    environment:
      SERVICE_URL_APP_8080: ${SERVICE_URL_APP_8080:-}
      DB_URL: jdbc:postgresql://postgres:5432/reassort
      DB_USER: reassort
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES manquant}
      # Jeton exigé par le serveur MCP (/mcp) ; vide, l'accès reste ouvert (développement local uniquement).
      REASSORT_MCP_JETON: ${SERVICE_PASSWORD_64_MCP:-}
    # Pas de port publié : le proxy de Coolify sert l'application en HTTPS.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reassort
      POSTGRES_USER: reassort
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES manquant}
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reassort -d reassort"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  donnees:
