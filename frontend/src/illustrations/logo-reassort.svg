<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Réassort">
  <title>Réassort</title>
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B865"/>
      <stop offset="1" stop-color="#0B7F45"/>
    </linearGradient>
    <linearGradient id="rs-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rs-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F2E9"/>
    </linearGradient>
    <linearGradient id="rs-cap-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F3EA"/>
    </linearGradient>
    <linearGradient id="rs-cap-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4F5D9"/>
      <stop offset="1" stop-color="#6FD9A0"/>
    </linearGradient>
    <clipPath id="rs-tile"><rect width="40" height="40" rx="10"/></clipPath>
    <clipPath id="rs-low"><rect x="-8" y="-4" width="8" height="8"/></clipPath>
    <clipPath id="rs-high"><rect x="0" y="-4" width="8" height="8"/></clipPath>
    <filter id="rs-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#053D21" flood-opacity=".35"/>
    </filter>
    <filter id="rs-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <style>
    /* Une seule lecture de 2,2 s, à chaque chargement de l'image.
       Sans animation (ancien moteur), on voit directement l'état final : la boîte seule. */
    .rs-a {
      transform-box: view-box;
      animation-duration: 2.2s;
      animation-delay: .1s;
      animation-fill-mode: both;
      animation-iteration-count: 1;
      animation-timing-function: linear;
    }
    .rs-drop   { opacity: 0; transform-origin: 20px 17px;   animation-name: rs-drop; }
    .rs-squash { transform-origin: 20px 33.5px; animation-name: rs-squash; }
    .rs-halo   { opacity: 0; animation-name: rs-halo; }
    .rs-ring   { opacity: 0; transform-origin: 20px 26px; animation-name: rs-ring; }
    .rs-cross  { transform-origin: 20px 27.2px; animation-name: rs-cross; }
    .rs-sheen  { transform: translateX(-46px); animation-name: rs-sweep; }
    .rs-star   { opacity: 0; transform-box: fill-box; transform-origin: center; animation-name: rs-star; }
    .rs-star.s2 { animation-delay: .22s; }
    .rs-star.s3 { animation-delay: .34s; }

    /* 1. La gélule tombe dans la boîte (0 → 0,75 s) */
    @keyframes rs-drop {
      0%   { transform: translateY(-16px) rotate(-20deg) scale(.7); opacity: 0; animation-timing-function: cubic-bezier(.2,.7,.3,1); }
      12%  { transform: translateY(-7px) rotate(-4deg) scale(1); opacity: 1; animation-timing-function: ease-in-out; }
      21%  { transform: translateY(-8.5px) rotate(0deg) scale(1); animation-timing-function: cubic-bezier(.55,0,1,.45); }
      34%  { transform: translateY(11px) rotate(42deg) scale(1); opacity: 1; }
      40%, 100% { transform: translateY(11px) rotate(42deg) scale(1); opacity: 0; }
    }
    /* 2. La boîte encaisse le choc */
    @keyframes rs-squash {
      0%, 33% { transform: scale(1, 1); animation-timing-function: ease-out; }
      38%     { transform: scale(1.06, .9); animation-timing-function: ease-in-out; }
      46%     { transform: scale(.98, 1.03); }
      53%, 100% { transform: scale(1, 1); }
    }
    /* 3. « Bien reçu » : halo, onde, croix qui pulse, reflet, étincelles */
    @keyframes rs-halo {
      0%, 38% { opacity: 0; }
      48%     { opacity: .95; }
      78%, 100% { opacity: 0; }
    }
    @keyframes rs-ring {
      0%, 40% { opacity: 0; transform: scale(.7); animation-timing-function: cubic-bezier(.2,.6,.3,1); }
      44%     { opacity: .8; }
      70%, 100% { opacity: 0; transform: scale(1.75); }
    }
    @keyframes rs-cross {
      0%, 40% { transform: scale(1); }
      48%     { transform: scale(1.28); }
      58%, 100% { transform: scale(1); }
    }
    @keyframes rs-sweep {
      0%, 46% { transform: translateX(-46px); animation-timing-function: cubic-bezier(.4,0,.2,1); }
      76%, 100% { transform: translateX(46px); }
    }
    @keyframes rs-star {
      0%, 42% { opacity: 0; transform: scale(.2) rotate(0deg); }
      50%     { opacity: 1; transform: scale(1.1) rotate(45deg); }
      66%, 100% { opacity: 0; transform: scale(.4) rotate(90deg); }
    }
  </style>

  <!-- Tuile -->
  <rect width="40" height="40" rx="10" fill="url(#rs-bg)"/>

  <g clip-path="url(#rs-tile)">
    <!-- ombre au sol -->
    <ellipse cx="20" cy="33.8" rx="11" ry="1.6" fill="#053D21" opacity=".25"/>

    <!-- onde « bien reçu » -->
    <circle class="rs-a rs-ring" cx="20" cy="26" r="10" fill="none" stroke="#fff" stroke-width="1.4"/>

    <!-- halo lumineux derrière la boîte -->
    <rect class="rs-a rs-halo" x="9" y="18.5" width="22" height="15.5" rx="3" fill="#fff" filter="url(#rs-blur)"/>

    <g class="rs-a rs-squash">
      <!-- intérieur de la boîte -->
      <rect x="10.5" y="19.2" width="19" height="3" rx=".8" fill="#0A6638"/>

      <!-- gélule (passe derrière la face avant) -->
      <g filter="url(#rs-shadow)">
        <g class="rs-a rs-drop">
          <g transform="translate(20 17) rotate(-62)">
            <rect x="-7.5" y="-3.25" width="15" height="6.5" rx="3.25" fill="url(#rs-cap-a)" clip-path="url(#rs-low)"/>
            <rect x="-7.5" y="-3.25" width="15" height="6.5" rx="3.25" fill="url(#rs-cap-b)" clip-path="url(#rs-high)"/>
            <rect x="-.5" y="-3.25" width="1" height="6.5" fill="#0B7F45" opacity=".22"/>
            <rect x="-5.2" y="-2" width="10.4" height="1.4" rx=".7" fill="#fff" opacity=".75"/>
          </g>
        </g>
      </g>

      <!-- face avant -->
      <rect x="10" y="21" width="20" height="12.5" rx="2" fill="url(#rs-box)"/>
      <g class="rs-a rs-cross">
        <rect x="18.9" y="24.1" width="2.2" height="6.2" rx=".6" fill="#16A34A"/>
        <rect x="16.9" y="26.1" width="6.2" height="2.2" rx=".6" fill="#16A34A"/>
      </g>
    </g>

    <!-- reflet final -->
    <g transform="rotate(20 20 20)">
      <rect class="rs-a rs-sheen" x="2" y="-10" width="14" height="60" fill="url(#rs-sheen)"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="39" height="39" rx="9.5" fill="none" stroke="#fff" stroke-opacity=".18"/>

  <!-- étincelles -->
  <g transform="translate(31 12)"><path class="rs-a rs-star"    d="M0-2.2Q.4-.4 2.2 0Q.4.4 0 2.2Q-.4.4-2.2 0Q-.4-.4 0-2.2Z" fill="#fff"/></g>
  <g transform="translate(8.5 14)"><path class="rs-a rs-star s2" d="M0-1.6Q.3-.3 1.6 0Q.3.3 0 1.6Q-.3.3-1.6 0Q-.3-.3 0-1.6Z" fill="#fff"/></g>
  <g transform="translate(34 22)"><path class="rs-a rs-star s3" d="M0-1.2Q.25-.25 1.2 0Q.25.25 0 1.2Q-.25.25-1.2 0Q-.25-.25 0-1.2Z" fill="#fff"/></g>
</svg>
